name: LotSocial hardening regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - rf/clarity-break-2026-08-28

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: npm test
