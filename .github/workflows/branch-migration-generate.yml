name: Branch migration generator

on:
  push:
    branches:
      - rf/complete-rocks-3-5-cloudflare
    paths:
      - db/schema.ts

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rf/complete-rocks-3-5-cloudflare
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm db:generate
      - name: Commit generated migration metadata
        run: |
          if git diff --quiet -- drizzle; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle
          git commit -m "chore: generate Rocket Fuel schema migration"
          git push origin HEAD:rf/complete-rocks-3-5-cloudflare
